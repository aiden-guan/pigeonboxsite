<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>PigeonBox — Flight study</title><style>*{box-sizing:border-box}body{margin:0;padding:48px;background:#dfedf4;color:#142d48;font:16px/1.5 "Avenir Next",sans-serif}main{max-width:1100px;margin:auto}a{color:inherit}h1{font-size:clamp(40px,6vw,72px);letter-spacing:-.06em;line-height:1;margin:32px 0 16px}p{max-width:650px;color:#536579}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}figure{margin:0;background:#f8fafb;border:1px solid #cbdbe6;border-radius:12px;padding:15px}.pose{display:block;aspect-ratio:1;background:url('/brand/pigeon-flight-atlas.png') 0 0/400% 300%;image-rendering:pixelated}figcaption{font-size:12px;border-top:1px solid #d8e2e9;padding-top:12px}figcaption b{margin-right:10px;color:#6a8ca7}@media(max-width:650px){body{padding:25px}.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><main><a href="/">← Back to PigeonBox</a><h1>A courier, in motion.</h1><p>Twelve generated flight poses. Anticipation, lift, a complete wingbeat, and a soft landing. Hover or tap the pigeon on the homepage to see the sequence in flight.</p><div class="grid"><figure><span class="pose" style="background-position:0.0% 0%"></span><figcaption><b>01</b> Perched</figcaption></figure><figure><span class="pose" style="background-position:33.333333333333336% 0%"></span><figcaption><b>02</b> Anticipation</figcaption></figure><figure><span class="pose" style="background-position:66.66666666666667% 0%"></span><figcaption><b>03</b> Push off</figcaption></figure><figure><span class="pose" style="background-position:100.0% 0%"></span><figcaption><b>04</b> Upstroke</figcaption></figure><figure><span class="pose" style="background-position:0.0% 50%"></span><figcaption><b>05</b> Sweep</figcaption></figure><figure><span class="pose" style="background-position:33.333333333333336% 50%"></span><figcaption><b>06</b> Downstroke</figcaption></figure><figure><span class="pose" style="background-position:66.66666666666667% 50%"></span><figcaption><b>07</b> Recovery</figcaption></figure><figure><span class="pose" style="background-position:100.0% 50%"></span><figcaption><b>08</b> Upstroke</figcaption></figure><figure><span class="pose" style="background-position:0.0% 100%"></span><figcaption><b>09</b> Glide</figcaption></figure><figure><span class="pose" style="background-position:33.333333333333336% 100%"></span><figcaption><b>10</b> Brake</figcaption></figure><figure><span class="pose" style="background-position:66.66666666666667% 100%"></span><figcaption><b>11</b> Land</figcaption></figure><figure><span class="pose" style="background-position:100.0% 100%"></span><figcaption><b>12</b> Settle</figcaption></figure></div></main><script type="module">import {paintFlightFrame} from './flight-frames.js'; const paint=()=>document.querySelectorAll('.pose').forEach((el,i)=>paintFlightFrame(el,i));paint();window.addEventListener('resize',paint);</script></body></html>
