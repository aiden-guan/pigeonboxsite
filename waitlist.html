<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud waitlist · PigeonBox</title>
  <meta name="description" content="PigeonBox Cloud is on its way. Join the waitlist for always-on summaries, prepared replies and follow-ups.">
  <link rel="canonical" href="https://usepigeonbox.com/waitlist">
  <meta name="theme-color" content="#f3f0e8">
  <meta property="og:type" content="website">
  <meta property="og:title" content="PigeonBox Cloud is on its way.">
  <meta property="og:description" content="A little help, even while you’re away. Join the Cloud waitlist.">
  <meta property="og:url" content="https://usepigeonbox.com/waitlist">
  <meta property="og:image" content="https://usepigeonbox.com/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/brand/pigeon-icon.png">
  <link rel="stylesheet" href="/dispatch.css?v=2">
  <link rel="stylesheet" href="/waitlist.css?v=4">
</head>
<body data-page="waitlist">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="/" aria-label="PigeonBox home"><span class="pidgy" data-state="idle" aria-hidden="true"></span><span class="wordmark">PigeonBox</span></a>
      <button class="cmdk-btn menu-cmdk" type="button" data-palette-open aria-haspopup="dialog" aria-expanded="false" aria-label="Open command palette"><span data-mod-key>⌘K</span></button>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu"><span></span><span></span></button>
      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <a href="/#product"><span class="key" aria-hidden="true">P</span>Product</a><a href="/local"><span class="key" aria-hidden="true">L</span>Local</a><a href="/waitlist" aria-current="page"><span class="key" aria-hidden="true">C</span>Cloud</a><a href="/pricing"><span class="key" aria-hidden="true">$</span>Pricing</a><a href="/docs"><span class="key" aria-hidden="true">D</span>Docs</a>
        <a class="account-link" href="/account" hidden>Sign in</a>
        <button class="cmdk-btn" type="button" data-palette-open aria-haspopup="dialog" aria-expanded="false" aria-label="Open command palette"><span data-mod-key>⌘K</span></button>
        <a class="nav-install" data-install href="https://github.com/aiden-guan/pigeonbox#-install">Install Local <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="wl-stage" aria-labelledby="waitlist-title">
      <canvas class="wl-dots" aria-hidden="true"></canvas>
      <div class="wl-props" role="group" aria-label="Pidgy’s world"></div>
      <div class="wl-tip" aria-hidden="true"></div>
      <div class="wl-content">
        <h1 id="waitlist-title" class="wl-title"><span class="wl-w" data-d="1">Join</span> <span class="wl-w" data-d="2">the</span> <span class="wl-w wl-accent" data-d="3">Waitlist.</span></h1>
        <form id="waitlist-form" class="wl-form wl-in" data-d="4" aria-describedby="waitlist-note" novalidate>
          <label class="sr-only" for="waitlist-email">Your email address</label>
          <div class="wl-perch">
            <input id="waitlist-email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required placeholder="you@example.com" aria-describedby="waitlist-status waitlist-note">
            <button class="wl-btn" type="submit">Join</button>
          </div>
          <div class="waitlist-trap" aria-hidden="true"><label for="waitlist-website">Website</label><input id="waitlist-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
          <p id="waitlist-status" class="wl-status" role="status" aria-live="polite" aria-atomic="true"></p>
          <p id="waitlist-note" class="wl-note"><a href="/privacy#waitlist">Privacy</a></p>
        </form>
        <noscript><p class="wl-note">Turn on JavaScript to join the waitlist.</p></noscript>
      </div>
    </section>
  </main>
  <footer class="waitlist-footer wrap"><a class="wordmark" href="/">PigeonBox</a><span>Gmail, sorted. Local first.</span><nav aria-label="Footer"><a href="/cloud">About Cloud</a><a href="/privacy">Privacy</a><a href="/docs">Docs</a></nav></footer>
  <script type="module" src="/site.js"></script>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/waitlist.js?v=9"></script>
</body>
</html>
